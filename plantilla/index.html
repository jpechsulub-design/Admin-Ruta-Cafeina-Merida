<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#12100e">
<title>Ruta Cafeína Mérida · Acceso privado</title>
<link rel="icon" href="img/marca-dorada.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Montserrat:wght@300;400;500;600&display=swap">
<link rel="stylesheet" href="css/estilos.css">
<link rel="stylesheet" href="css/competencia.css">
<link rel="stylesheet" href="css/prospectos.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>
<div class="puerta" id="puerta">
  <div class="puerta-caja">
    <img src="img/marca-blanca.png" alt="Ruta Cafeína Mérida" width="150" height="82">
    <p class="etiqueta">Acceso privado</p>
    <h1>Panel de Ruta Cafeína Mérida</h1>
    <p class="puerta-texto">Escribe la contraseña para ver el contenido. Sin ella, esta página solo guarda texto cifrado.</p>
    <form id="puerta-form" autocomplete="off">
      <label for="clave">Contraseña</label>
      <input id="clave" name="clave" type="password" autocomplete="current-password" required spellcheck="false" autofocus>
      <button class="boton boton-oro" id="puerta-boton" type="submit">Entrar</button>
      <p class="puerta-msg" id="puerta-msg" role="alert"></p>
    </form>
  </div>
</div>
<div id="app" hidden></div>
<script type="application/json" id="carga">{{CARGA}}</script>
<script src="js/prospectos.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
